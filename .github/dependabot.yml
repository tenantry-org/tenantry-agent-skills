version: 2
updates:
  # The workflows' actions, which are pinned to a commit SHA.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'UTC'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
