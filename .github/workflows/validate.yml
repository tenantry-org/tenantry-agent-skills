name: validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Manifests, skills and links
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, with the version in a comment; Dependabot keeps both up to date, and
      # validate.mjs fails on an action that is not pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/validate.mjs
