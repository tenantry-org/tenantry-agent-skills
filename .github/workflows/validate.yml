name: validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC, so the checks that wait for a release start without a commit
  workflow_dispatch:

concurrency:
  # A newer push to a pull request cancels its older run. Any other run, a push to master, the weekly run or one
  # started by hand, gets a group of its own, so none cancels another.
  group: validate-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The release the skills are written for. Its docs and its packages are what the links and code blocks are checked
  # against. Until it is published, those two checks print a notice and pass; they start checking on their own once it
  # is, by the next weekly run at the latest, so a mistake shows up then rather than being hidden by a setting someone
  # has to remember to change.
  TENANTRY_VERSION: 0.7.0

jobs:
  validate:
    name: Manifests, skills, links and removed names
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, with the version in a comment; Dependabot keeps both up to date, and
      # validate.mjs fails on an action that is not pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Each repository on its own: a missing tag in one leaves the other's headings checked. Only a missing tag is
      # skipped; any other failure to reach a repository fails the step.
      - name: Fetch the docs of the release the skills target
        id: docs
        run: |
          args=""
          for pair in core:tenantry-core pro:tenantry-pro-docs; do
            group="${pair%%:*}" repo="${pair#*:}"
            url="https://github.com/tenantry-org/$repo"
            tags="$(git ls-remote --tags "$url" "refs/tags/v$TENANTRY_VERSION")"
            if [[ -z "$tags" ]]; then
              echo "::notice::$repo has no v$TENANTRY_VERSION tag yet, so links to the $group docs are checked by page name only."
              continue
            fi
            git clone --quiet --depth 1 --branch "v$TENANTRY_VERSION" "$url" "$RUNNER_TEMP/$repo"
            args="$args --$group-docs $RUNNER_TEMP/$repo/docs"
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - run: node scripts/validate.mjs ${{ steps.docs.outputs.args }}

  snippets:
    name: Code blocks build against Tenantry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Builds the Tenantry Core blocks against the packages on nuget.org. The tenantry-pro skill's blocks need the Pro
      # packages, which are on a private feed, so they are built locally (scripts/check-snippets.sh).
      - run: scripts/check-snippets.sh
        env:
          SKIP_UNPUBLISHED: 1
