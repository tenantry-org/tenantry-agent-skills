name: validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC, so the checks that wait for a release start without a commit
  workflow_dispatch:

concurrency:
  # A newer push to a pull request cancels its older run. Any other run, a push to master, the weekly run or one
  # started by hand, gets a group of its own, so none cancels another.
  group: validate-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Manifests, skills, links and removed names
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, with the version in a comment; Dependabot keeps both up to date, and
      # validate.mjs fails on an action that is not pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The release the skills target is in scripts/tenantry-version.txt, which update-version.yml raises when a newer
      # Tenantry release is out. Until that release's tags exist, links to the docs are checked by page name only, with
      # a notice, and the full check starts on its own once they do, by the next weekly run at the latest.
      - name: Check against the docs of the release the skills target
        run: |
          args="$(scripts/fetch-docs.sh "$RUNNER_TEMP")"
          # shellcheck disable=SC2086 # args holds several options
          node scripts/validate.mjs $args
      - name: Check the scripts the workflows call
        run: shellcheck -S warning scripts/*.sh

  snippets:
    name: Code blocks build against Tenantry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Builds the Tenantry Core blocks against the packages on nuget.org. The tenantry-pro skill's blocks need the Pro
      # packages, which are on a private feed, so they are built locally (scripts/check-snippets.sh). Until the release
      # the skills target is on nuget.org, this prints a notice and passes.
      - run: scripts/check-snippets.sh
        env:
          SKIP_UNPUBLISHED: 1
